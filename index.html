<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">Marlon</div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Works</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div id="container3D">
            
            <div class="hero-content">
                <div class="hero-text">
                    <h1>Hi,<br>I'am <span>Marlon</span><br>Web Designer</h1>
                    <button class="btn-contact" onclick="openLightbox('1000012204-removebg-preview.png')">Contact</button>
                </div>
                
                <div class="hero-image-container">
                    <div class="blob-bg">
                        <img src="1000012204-removebg-preview.png" alt="Marlon" class="profile-img">
                    </div>
                </div>
            </div>

            <div class="social-icons">
                <a href="#" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>

                <a href="#" target="_blank"><i class="fa-brands fa-github"></i></a>
            </div>
            
        </div>
    </main>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script type="module" src="js/main.js"></script>
    <script>
    function openLightbox(src) {
        const lb = document.getElementById("lightbox");
        const lbImg = document.getElementById("lightbox-img");
        
        lb.style.display = "flex";
        lbImg.src = src;

        // Aktivuje Fullscreen mód prohlížeče
        if (lb.requestFullscreen) {
            lb.requestFullscreen();
        } else if (lb.webkitRequestFullscreen) { // Safari
            lb.webkitRequestFullscreen();
        }
    }

    function closeLightbox() {
        const lb = document.getElementById("lightbox");
        lb.style.display = "none";

        // Vypne Fullscreen mód při zavření
        if (document.fullscreenElement) {
            document.exitFullscreen();
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeLightbox();
        }
    });
    </script>
        
</body>
</html>
