<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Procházka - Design Portfolio</title>
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .portfolio-section {
            width: 100%;
            margin-top: 10px;
        }

        .section-title {
            font-size: 2.2rem;
            color: var(--text-light);
            margin-bottom: 30px;
            font-weight: 700;
        }

        .section-title span {
            color: var(--primary-color);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .portfolio-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3; 
            border: 1px solid rgba(229, 9, 20, 0.15);
            background-color: var(--bg-dark-page);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .portfolio-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            transition: transform 0.3s ease;
        }

        .portfolio-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.25);
        }

        .portfolio-item:hover .portfolio-img {
            transform: scale(1.05);
        }

        .item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .item-overlay span {
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--primary-color);
            padding: 8px 18px;
            border-radius: 6px;
            background-color: rgba(229, 9, 20, 0.1);
        }

        .portfolio-item:hover .item-overlay {
            opacity: 1;
        }

       
        #lightbox-img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            border: 2px solid var(--primary-color);
            border-radius: 10px;
        }

        @media (max-width: 900px) {
            .portfolio-grid {
                grid-template-columns: repeat(2, 1fr); 
            }
            .section-title {
                text-align: center;
            }
        }

        @media (max-width: 600px) {
            .portfolio-grid {
                grid-template-columns: 1fr; 
            }
        }
    </style>
</head>
<body>

    <main>
        <div id="container3D">
            
            <header class="navbar">
                <div class="logo">Procházka</div>
                <nav class="nav-links">
                    <a href="index.html">Domov</a> 
                    <a href="#" class="active">Design</a>
                    <a href="stranky.html">Stránky</a>
                    <a href="blender.html">Blender</a>
                    <a href="kontakt.html">Kontakt</a>
                </nav>
            </header>
            
            <div class="portfolio-section">
                <h2 class="section-title">Moje <span>Projekty</span></h2>
                
                <div class="portfolio-grid">
                    <div class="portfolio-item" onclick="openLightbox('Instagram story VR (1).png')">
                        <img src="Instagram story VR (1).png" alt="Design 1" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>
                    
                    <div class="portfolio-item" onclick="openLightbox('Hexagon soutez.png')">
                        <img src="Hexagon soutez.png" alt="Design 2" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>
                    
                    <div class="portfolio-item" onclick="openLightbox('polygon fenek1.png')">
                        <img src="polygon fenek1.png" alt="Design 3" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>
                    
                    <div class="portfolio-item" onclick="openLightbox('pejot.png')">
                        <img src="pejot.png" alt="Design 4" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>
                    
                    <div class="portfolio-item" onclick="openLightbox('zaba.png')">
                        <img src="zaba.png" alt="Design 5" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>
                    
                    <div class="portfolio-item" onclick="openLightbox('citroen.png')">
                        <img src="citroen.png" alt="Design 6" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>

                    <div class="portfolio-item" onclick="openLightbox('VØID-removebg-preview (2).png')">
                        <img src="VØID-removebg-preview (2).png" alt="Design 7" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>

                    <div class="portfolio-item" onclick="openLightbox('Vizitky - Procházka Martin.png')">
                        <img src="Vizitky - Procházka Martin.png" alt="Design 8" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>

                    <div class="portfolio-item" onclick="openLightbox('kapela.png')">
                        <img src="kapela.png" alt="Design 9" class="portfolio-img">
                        <div class="item-overlay">
                            <span>Zobrazit detail</span>
                        </div>
                    </div>

                </div> </div> </div>
    </main>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
    function openLightbox(src) {
        const lb = document.getElementById("lightbox");
        const lbImg = document.getElementById("lightbox-img");
        
        lb.style.display = "flex";
        lbImg.src = src;

        if (lb.requestFullscreen) {
            lb.requestFullscreen();
        } else if (lb.webkitRequestFullscreen) {
            lb.webkitRequestFullscreen();
        }
    }

    function closeLightbox() {
        const lb = document.getElementById("lightbox");
        lb.style.display = "none";

        if (document.fullscreenElement) {
            document.exitFullscreen();
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeLightbox();
        }
    });
    </script>
        
</body>
</html>
