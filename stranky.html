<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Procházka - Webové Stránky</title>
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .portfolio-section {
            width: 100%;
            margin-top: 10px;
        }

        .section-title {
            font-size: 2.2rem;
            color: var(--text-light);
            margin-bottom: 30px;
            font-weight: 700;
        }

        .section-title span {
            color: var(--primary-color);
        }

        .web-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
        }

        .web-item-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .web-item {
            background-color: var(--bg-dark-page);
            border: 1px solid rgba(229, 9, 20, 0.15);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .web-preview-container {
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid rgba(229, 9, 20, 0.1);
        }

        .web-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .web-info {
            padding: 20px;
        }

        .web-info h3 {
            color: var(--text-light);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .web-info p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .web-item-link:hover .web-item {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 12px 30px rgba(229, 9, 20, 0.2);
        }

        .web-item-link:hover .web-img {
            transform: scale(1.03);
        }

        .web-item-link:hover .web-info h3 {
            color: var(--primary-color);
        }

        @media (max-width: 900px) {
            .web-grid {
                grid-template-columns: repeat(2, 1fr); 
            }
            .section-title {
                text-align: center;
            }
        }

        @media (max-width: 600px) {
            .web-grid {
                grid-template-columns: 1fr; 
            }
        }
    </style>
</head>
<body>

    <main>
        <div id="container3D">
            
            <header class="navbar">
                <div class="logo"> Procházka </div>
                <nav class="nav-links">
                    <a href="index.html">Domov</a> 
                    <a href="design.html">Design</a>
                    <a href="#" class="active">Stránky</a>
                    <a href="blender.html">Blender</a>
                    <a href="kontakt.html">Kontakt</a>
                </nav>
            </header>
            
            <div class="portfolio-section">
                <h2 class="section-title">Webové <span>Stránky</span></h2>
                
                <div class="web-grid">
                    
                    <a href="https://martinprochazka.endora.site/WEB%20AI/index.html" class="web-item-link" target="_blank">
                        <div class="web-item">
                            <div class="web-preview-container">
                                <img src="webAI2.png" alt="WEB AI" class="web-img">
                            </div>
                            <div class="web-info">
                                <h3>WEB Auto bazar</h3>
                                <p>Prezentace jak by mohl vypadat web na auto bazar.</p>
                            </div>
                        </div>
                    </a>
                    
                    <a href="https://martinprochazka.endora.site/WEB%20kapela/index.html" class="web-item-link" target="_blank">
                        <div class="web-item">
                            <div class="web-preview-container">
                                <img src="voidweb.png" alt="WEB kapela" class="web-img">
                            </div>
                            <div class="web-info">
                                <h3>WEB Kapela</h3>
                                <p>Návrh jak by mohl vypdat web kapely.</p>
                            </div>
                        </div>
                    </a>
                    
                    <a href="https://martin-procha.github.io/Lilek-clicker/" class="web-item-link" target="_blank">
                        <div class="web-item">
                            <div class="web-preview-container">
                                <img src="lilekweb.png" alt="Lilek clicker" class="web-img">
                            </div>
                            <div class="web-info">
                                <h3>Lilek Clicker</h3>
                                <p>Hra v prohlížečí na styl cookie clickeru.</p>
                            </div>
                        </div>
                    </a>

                </div>
            </div>
            
        </div>
    </main>

</body>
</html>
